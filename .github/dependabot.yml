version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions (React 19, TypeScript 7, ESLint 10, Vitest 5, ...) need a
    # deliberate migration, so they are skipped here and upgraded by hand.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
        # Pre-1.0 packages can break on a minor bump (0.97 -> 0.98 is classed
        # as semver-minor), so keep the SDK behind /api/reading out of the
        # routine group: it always arrives as its own PR.
        exclude-patterns: ['@anthropic-ai/sdk']
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
